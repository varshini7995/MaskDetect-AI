<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - MaskDetect AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: #1d2948;

            background:
                linear-gradient(
                    135deg,
                    #f5efff 0%,
                    #faf9ff 48%,
                    #edf6ff 100%
                );

            position: relative;
        }


        /* =========================
           BACKGROUND CIRCLES
        ========================= */

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .circle-one {
            width: 175px;
            height: 175px;

            left: -55px;
            top: 145px;

            background: rgba(130, 98, 239, 0.10);
        }

        .circle-two {
            width: 150px;
            height: 150px;

            right: 280px;
            top: 155px;

            background: rgba(130, 98, 239, 0.07);
        }

        .circle-three {
            width: 250px;
            height: 250px;

            right: -75px;
            bottom: -55px;

            background: rgba(65, 143, 237, 0.10);
        }

        .circle-four {
            width: 115px;
            height: 115px;

            left: 20%;
            bottom: 20px;

            background: rgba(130, 98, 239, 0.06);
        }


        /* =========================
           CARD
        ========================= */

        .reset-card {
            width: 515px;
            max-width: calc(100% - 40px);

            background: rgba(255, 255, 255, 0.98);

            border-radius: 20px;

            padding: 40px 43px 42px;

            box-shadow:
                0 18px 45px rgba(65, 75, 125, 0.13);

            position: relative;
            z-index: 5;
        }


        /* =========================
           ICON
        ========================= */

        .reset-icon {
            width: 54px;
            height: 54px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #2879ed;
        }

        .reset-icon svg {
            width: 50px;
            height: 50px;
        }


        /* =========================
           TITLE
        ========================= */

        .reset-title {
            text-align: center;

            color: #182546;

            font-size: 25px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .reset-subtitle {
            text-align: center;

            color: #66718a;

            font-size: 14px;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #263653;

            font-size: 14px;
            font-weight: 700;

            margin-bottom: 8px;
        }


        /* =========================
           INPUT
        ========================= */

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            width: 20px;
            height: 20px;

            color: #596579;

            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 42px;

            padding:
                0 14px 0 52px;

            border: 1px solid #d9dee8;

            border-radius: 7px;

            background: #fafbfd;

            color: #263653;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #8992a5;
        }

        .input-wrapper input:focus {
            border-color: #6489ed;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(91, 99, 230, 0.10);
        }


        /* =========================
           UPDATE BUTTON
        ========================= */

        .update-button {
            width: 100%;
            height: 45px;

            margin-top: 2px;

            border: none;

            border-radius: 7px;

            background: linear-gradient(
                100deg,
                #7047e9,
                #398fe9
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 17px rgba(83, 72, 216, 0.21);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .update-button:hover {
            background: linear-gradient(
                100deg,
                #914ff5,
                #279af3
            );

            transform: translateY(-4px);

            box-shadow:
                0 14px 27px rgba(83, 72, 216, 0.35);

            animation: buttonBounce 0.4s ease;
        }


        /* =========================
           BACK TO LOGIN
        ========================= */

        .back-login {
            display: block;

            margin-top: 22px;

            text-align: center;

            text-decoration: none;

            color: #4f5d75;

            font-size: 14px;
            font-weight: 600;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back-login:hover {
            color: #276bea;

            transform: translateY(-3px);

            animation: linkBounce 0.35s ease;
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes buttonBounce {

            0% {
                transform: translateY(0);
            }

            35% {
                transform: translateY(-7px);
            }

            65% {
                transform: translateY(-2px);
            }

            100% {
                transform: translateY(-4px);
            }
        }

        @keyframes linkBounce {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }

            100% {
                transform: translateY(-3px);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow: auto;
                padding: 20px 0;
            }

            .reset-card {
                width: calc(100% - 28px);

                padding:
                    32px 24px 34px;
            }

            .reset-title {
                font-size: 23px;
            }

            .reset-subtitle {
                font-size: 13px;
            }

            .circle-two,
            .circle-four {
                display: none;
            }

            .circle-three {
                width: 180px;
                height: 180px;
            }
        }
    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="bg-circle circle-one"></div>

    <div class="bg-circle circle-two"></div>

    <div class="bg-circle circle-three"></div>

    <div class="bg-circle circle-four"></div>


    <!-- FORGOT / RESET PASSWORD CARD -->

    <div class="reset-card">


        <!-- LOCK ICON -->

        <div class="reset-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <rect
                    x="3"
                    y="10"
                    width="18"
                    height="11"
                    rx="2"
                ></rect>

                <path
                    d="M7 10V7a5 5 0 0 1 10 0"
                ></path>

                <path
                    d="M12 14v3"
                ></path>

            </svg>

        </div>


        <h1 class="reset-title">
            Reset Password
        </h1>


        <p class="reset-subtitle">
            Enter your email and set a new password for your account.
        </p>


        <!-- IMPORTANT:
             Keep action pointing to forgot_password
             because this matches your existing app.py.
        -->

        <form
            action="{{ url_for('forgot_password') }}"
            method="POST"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <svg
                        class="input-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <path
                            d="m3 7 9 6 9-6"
                        ></path>

                    </svg>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <div class="input-wrapper">

                    <svg
                        class="input-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        ></rect>

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        ></path>

                    </svg>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="input-wrapper">

                    <svg
                        class="input-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                        ></rect>

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        ></path>

                    </svg>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                </div>

            </div>


            <!-- UPDATE PASSWORD -->

            <button
                type="submit"
                class="update-button"
            >
                Update Password
            </button>

        </form>


        <!-- BACK TO LOGIN -->

        <a
            href="{{ url_for('login') }}"
            class="back-login"
        >
            ← &nbsp; Back to Login
        </a>


    </div>


</body>

</html>
